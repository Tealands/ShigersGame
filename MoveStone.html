<!DOCTYPE html>
<html lang="ja">
<head>
  <link rel="icon" href="KeepOut/Shiger.jpg" type="image/x-icon">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  
  <title>移碁 - 対局</title>
  <style>
    body {
      font-family: "Noto Sans JP", sans-serif;
      text-align: center;
      background-color: #f7f3e3;
    }
    #board {
      position: relative;
      margin: 20px auto;
      background-color: #f3d9a3;
      border: 2px solid #000;
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      pointer-events: none;
    }
    .stone {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      position: absolute;
      transform: translate(-50%, -50%);
      transition: 0.2s;
    }
    .black { background-color: black; }
    .white { background-color: white; border: 1px solid #000; }
    #turnPhase { font-size: 24px; margin: 10px; }
    #controls { margin-bottom: 10px; }
    button {
      font-size: 18px;
      padding: 6px 12px;
      margin: 5px;
    }
    #moveControls {
      display: none;
      margin: 15px;
    }
    #moveControls button {
      margin: 4px;
      font-size: 16px;
      padding: 5px 10px;
    }
  </style>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; font-family: "Noto Sans JP", sans-serif; color: #e2e8f0; background: #020617; text-align: left; }
    header { position: sticky; top: 0; z-index: 10; padding: 14px 24px; background: rgba(15,23,42,.92); border-bottom: 1px solid #1e293b; backdrop-filter: blur(12px); }
    .header-inner, main, footer { width: min(100% - 32px, 1280px); margin: 0 auto; }
    .header-inner { display: flex; align-items: center; gap: 12px; }
    .brand-mark { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 12px; color: #111827; background: linear-gradient(135deg,#fbbf24,#b45309); font-weight: 900; font-size: 20px; }
    h1 { margin: 0; color: #fbbf24; font-size: 19px; line-height: 1.25; }
    .subtitle { margin: 3px 0 0; color: #94a3b8; font-size: 12px; }
    main { display: grid; grid-template-columns: minmax(260px, 4fr) minmax(0, 8fr); gap: 24px; align-items: start; padding: 24px 0; }
    .panel, .board-panel { background: #0f172a; border: 1px solid #1e293b; border-radius: 20px; box-shadow: 0 20px 40px #0003; }
    .panel { padding: 20px; }
    .eyebrow { margin: 0 0 14px; color: #94a3b8; font-size: 11px; font-weight: 800; letter-spacing: .08em; }
    #turnPhase { padding: 16px; margin: 0 0 16px; border-radius: 14px; border: 1px solid #f59e0b55; background: #f59e0b12; color: #fcd34d; font-size: 18px; font-weight: 800; }
    .controls { display: grid; gap: 10px; }
    button { border: 1px solid #334155; border-radius: 12px; padding: 11px 14px; color: #e2e8f0; background: #1e293b; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; transition: .18s ease; }
    button:hover { border-color: #f59e0b; background: #334155; }
    button.primary { color: #fff; border-color: #d97706; background: #d97706; }
    button.primary:hover { background: #f59e0b; }
    #moveControls { display: none; margin-top: 18px; padding: 16px; border: 1px solid #334155; border-radius: 16px; background: #02061780; text-align: center; }
    #moveControls h3 { margin: 0 0 10px; color: #fbbf24; font-size: 13px; }
    #moveControls div { display: flex; justify-content: center; gap: 8px; margin: 6px 0; }
    #moveControls button { width: 48px; height: 42px; padding: 0; font-size: 20px; }
    .help { margin: 16px 0 0; color: #94a3b8; font-size: 12px; line-height: 1.7; }
    .board-panel { min-width: 0; padding: 16px; }
    .board-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0 0 12px; color: #cbd5e1; font-size: 12px; }
    .board-scroll { overflow: auto; padding: 4px; }
    #board { position: relative; margin: 0 auto; background-color: #e5a95d; background-image: radial-gradient(#d99343 1px, transparent 0), linear-gradient(135deg,#e8b66f,#d99848); background-size: 24px 24px, auto; border: 1px solid #7c4a21; border-radius: 12px; box-shadow: inset 0 0 20px #0003, 0 14px 28px #0005; }
    canvas { position: absolute; inset: 0; pointer-events: none; }
    .stone { width: 24px; height: 24px; border-radius: 50%; position: absolute; transform: translate(-50%, -50%); transition: .2s; z-index: 1; touch-action: none; }
    #board { touch-action: none; }
    .stone.dragging { opacity: .35; }
    .drag-ghost { position: absolute; z-index: 5; pointer-events: none; transform: translate(-50%, -50%); opacity: .9; box-shadow: 0 6px 14px #0008; }
    .black { background: radial-gradient(circle at 35% 30%,#4b5563,#111827 72%); box-shadow: 2px 3px 6px #0007,inset -1px -1px 2px #ffffff33; }
    .white { background: radial-gradient(circle at 35% 30%,#fff,#d1d5db 72%); border: 1px solid #94a3b8; box-shadow: 2px 3px 6px #0006; }
    footer { padding: 0 0 16px; color: #64748b; text-align: center; font-size: 11px; }
    @media (max-width: 850px) { main { grid-template-columns: 1fr; } .board-panel { grid-row: 1; } }
    @media (max-width: 560px) { header { padding: 12px 16px; } .header-inner, main, footer { width: min(100% - 20px, 1280px); } main { gap: 14px; padding: 14px 0; } .panel, .board-panel { padding: 14px; } }
  </style>
</head>
<body onload="initializeGame()">
  <header><div class="header-inner"><div class="brand-mark">移</div><div><h1>移碁</h1><p class="subtitle">石を動かして相手を囲む、戦略型五目ゲーム</p></div></div></header>
  <main>
    <aside class="panel">
      <p class="eyebrow">対局状況</p>
      <div id="turnPhase">黒の手番</div>
      <div class="controls">
        <button class="primary" onclick="toggleMoveMode()">石の移動モードを切り替え</button>
        <button onclick="undo()">1手戻す</button>
        <button onclick="goHome()">ホームへ戻る</button>
      </div>
      <div id="moveControls"><h3>自分の石をつかんで、隣の空点に置いてください</h3><p class="help">1回の操作で1マス移動します。1ターンに2回まで移動できます。</p></div>
      <p class="help">通常モードでは空き交点に石を置きます。移動モードでは自分の石を隣の空点へドラッグします。</p>
    </aside>
    <section class="board-panel"><div class="board-heading"><span>ゲーム盤</span><span>盤サイズはURL設定に連動</span></div><div class="board-scroll"><div id="board"><canvas id="grid"></canvas></div></div></section>
  </main>
  <footer>移碁 · Shiger's Games</footer>

  <script>
    let SIZE = 19;
    const CELL = 30;
    const OFFSET = CELL;
    let board = [];
    let selectedStone = null;
    let moveMode = false;
    let moveCount = 0; // 1ターン中の移動回数
    let turnCounter = 0;
    let history = [];

    function goHome() {
      if (confirm("対局を終了してホームへ戻りますか？")) {
        window.location.href = "title.html";
      }
    }

    function getBoardSizeFromURL() {
      const params = new URLSearchParams(window.location.search);
      const size = parseInt(params.get("size")) || 19;
      return [9, 13, 19].includes(size) ? size : 19;
    }

    function initializeGame() {
      SIZE = getBoardSizeFromURL();
      initializeBoard();
    }

    function initializeBoard() {
      board = Array.from({ length: SIZE }, () => Array(SIZE).fill(0));
      setupCanvas();
      drawGrid();
      drawBoard();
    }

    function setupCanvas() {
      const boardDiv = document.getElementById("board");
      const canvas = document.getElementById("grid");
      const length = (SIZE - 1) * CELL + OFFSET * 2;
      boardDiv.style.width = length + "px";
      boardDiv.style.height = length + "px";
      canvas.width = length;
      canvas.height = length;
    }

    function drawGrid() {
      const canvas = document.getElementById("grid");
      const ctx = canvas.getContext("2d");
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = "#555";
      ctx.lineWidth = 1;
      const length = (SIZE - 1) * CELL + OFFSET * 2;

      for (let i = 0; i < SIZE; i++) {
        const pos = OFFSET + i * CELL;
        ctx.beginPath();
        ctx.moveTo(OFFSET, pos);
        ctx.lineTo(length - OFFSET, pos);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(pos, OFFSET);
        ctx.lineTo(pos, length - OFFSET);
        ctx.stroke();
      }
      drawStars(ctx);
    }

    function drawStars(ctx) {
      ctx.fillStyle = "#000";
      let starCoords = [];
      if (SIZE === 9) starCoords = [2, 4, 6];
      else if (SIZE === 13) starCoords = [3, 6, 9];
      else if (SIZE === 19) starCoords = [3, 9, 15];
      else return;
      for (const i of starCoords) {
        for (const j of starCoords) {
          const x = OFFSET + j * CELL;
          const y = OFFSET + i * CELL;
          ctx.beginPath();
          ctx.arc(x, y, 3, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }

    function drawBoard() {
      const boardDiv = document.getElementById("board");
      document.querySelectorAll(".stone").forEach(s => s.remove());
      for (let i = 0; i < SIZE; i++) {
        for (let j = 0; j < SIZE; j++) {
          if (board[i][j] !== 0) {
            const stone = document.createElement("div");
            stone.classList.add("stone", board[i][j] === 1 ? "black" : "white");
            stone.style.left = (OFFSET + j * CELL) + "px";
            stone.style.top = (OFFSET + i * CELL) + "px";
            boardDiv.appendChild(stone);
          }
        }
      }
    }

    function saveState() {
      const boardCopy = board.map(row => [...row]);
      history.push({ board: boardCopy, turnCounter, moveMode, moveCount });
    }

    function undo() {
      if (history.length === 0) {
        alert("戻せる手はありません。");
        return;
      }
      const prev = history.pop();
      board = prev.board.map(row => [...row]);
      turnCounter = prev.turnCounter;
      moveMode = prev.moveMode;
      moveCount = prev.moveCount;
      drawBoard();
      updateTurnPhaseDisplay();
    }

    function updateTurnPhaseDisplay() {
      const turnPhase = document.getElementById("turnPhase");
      if (Math.floor(turnCounter) % 2 === 0) turnPhase.innerText = "黒の手番";
      else turnPhase.innerText = "白の手番";
    }

    function TurnPhase() {
      turnCounter += 1;
      updateTurnPhaseDisplay();
    }

    function placeStone(x, y) {
      const turn = document.getElementById("turnPhase").innerText;
      const player = turn === "黒の手番" ? 1 : 2;
      if (board[y][x] === 0) {
        saveState();
        board[y][x] = player;
        checkAndRemoveSurrounded(3 - player);
        drawBoard();
        TurnPhase();
      } else {
        alert("そこには置けません。");
      }
    }

    function toggleMoveMode() {
      moveMode = !moveMode;
      moveCount = 0;
      selectedStone = null;
      document.getElementById("moveControls").style.display = moveMode ? "block" : "none";
      document.querySelector("#moveControls h3").textContent = "自分の石をつかんで、隣の空点に置いてください";
    }
  const boardElement = document.getElementById("board");
  let draggedStone = null;
  let dragGhost = null;

  boardElement.addEventListener("pointerdown", event => {
    if (!moveMode || event.button !== 0) return;
    const rect = boardElement.getBoundingClientRect();
    const x = Math.round((event.clientX - rect.left - OFFSET) / CELL);
    const y = Math.round((event.clientY - rect.top - OFFSET) / CELL);
    const player = Math.floor(turnCounter) % 2 === 0 ? 1 : 2;
    if (x < 0 || x >= SIZE || y < 0 || y >= SIZE || board[y][x] !== player) return;
    const stone = [...boardElement.querySelectorAll(".stone")].find(el =>
      Math.round((parseFloat(el.style.left) - OFFSET) / CELL) === x &&
      Math.round((parseFloat(el.style.top) - OFFSET) / CELL) === y
    );
    if (!stone) return;
    event.preventDefault();
    draggedStone = { x, y, player, element: stone, pointerId: event.pointerId };
    stone.classList.add("dragging");
    dragGhost = stone.cloneNode(true);
    dragGhost.classList.remove("dragging");
    dragGhost.classList.add("drag-ghost");
    boardElement.appendChild(dragGhost);
    boardElement.setPointerCapture(event.pointerId);
    updateDragGhost(event);
  });

  boardElement.addEventListener("pointermove", event => {
    if (draggedStone && event.pointerId === draggedStone.pointerId) updateDragGhost(event);
  });

  boardElement.addEventListener("pointerup", event => {
    if (!draggedStone || event.pointerId !== draggedStone.pointerId) return;
    const rect = boardElement.getBoundingClientRect();
    const nx = Math.round((event.clientX - rect.left - OFFSET) / CELL);
    const ny = Math.round((event.clientY - rect.top - OFFSET) / CELL);
    const { x, y, player, element } = draggedStone;
    element.classList.remove("dragging");
    dragGhost?.remove();
    dragGhost = null;
    draggedStone = null;
    if (nx >= 0 && nx < SIZE && ny >= 0 && ny < SIZE && Math.abs(nx - x) + Math.abs(ny - y) === 1) {
      moveStoneTo(x, y, nx, ny, player);
    }
  });

  boardElement.addEventListener("pointercancel", () => {
    if (draggedStone) draggedStone.element.classList.remove("dragging");
    dragGhost?.remove();
    dragGhost = null;
    draggedStone = null;
  });

  function updateDragGhost(event) {
    const rect = boardElement.getBoundingClientRect();
    dragGhost.style.left = `${event.clientX - rect.left}px`;
    dragGhost.style.top = `${event.clientY - rect.top}px`;
  }

  boardElement.addEventListener("click", event => {
    if (moveMode) return;
    const rect = boardElement.getBoundingClientRect();
    const x = Math.round((event.clientX - rect.left - OFFSET) / CELL);
    const y = Math.round((event.clientY - rect.top - OFFSET) / CELL);
    if (x >= 0 && x < SIZE && y >= 0 && y < SIZE) placeStone(x, y);
  });

  function moveStoneTo(x, y, nx, ny, player) {
      if (board[ny][nx] !== 0) return;
      saveState();
      board[y][x] = 0;
      board[ny][nx] = player;
      checkAndRemoveSurrounded(3 - player);
      drawBoard();

      moveCount++;
      selectedStone = {x: nx, y: ny, player};

      if (moveCount >= 2) {
        moveMode = false;
        moveCount = 0;
        document.getElementById("moveControls").style.display = "none";
        TurnPhase();
      } else {
        document.querySelector("#moveControls h3").textContent = "あと1回移動できます。石を隣の空点へドラッグしてください";
      }
    }

    function checkAndRemoveSurrounded(targetPlayer) {
      const visited = Array.from({ length: SIZE }, () => Array(SIZE).fill(false));
      for (let y = 0; y < SIZE; y++) {
        for (let x = 0; x < SIZE; x++) {
          if (board[y][x] === targetPlayer && !visited[y][x]) {
            const group = [];
            const liberties = countLiberties(x, y, targetPlayer, visited, group);
            if (liberties === 0) {
              for (const {gx, gy} of group) board[gy][gx] = 0;
            }
          }
        }
      }
    }

    function countLiberties(x, y, player, visited, group) {
      const stack = [{x, y}];
      let liberties = 0;
      const dirs = [[1,0],[-1,0],[0,1],[0,-1]];
      while (stack.length > 0) {
        const {x, y} = stack.pop();
        if (visited[y][x]) continue;
        visited[y][x] = true;
        group.push({gx: x, gy: y});
        for (const [dx, dy] of dirs) {
          const nx = x + dx, ny = y + dy;
          if (nx < 0 || ny < 0 || nx >= SIZE || ny >= SIZE) continue;
          if (board[ny][nx] === 0) liberties++;
          else if (board[ny][nx] === player && !visited[ny][nx]) stack.push({x: nx, y: ny});
        }
      }
      return liberties;
    }
  </script>
</body>
</html>
